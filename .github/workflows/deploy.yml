name: "Deploy projeto front-end Escalla imobiliária"

on:
  push:
    branches:
      - staging

jobs:
  build_front_end_escalla_staging:
    runs-on: ubuntu-latest

    steps:
      - name: "Baixar o código"
        uses: actions/checkout@v4

      - name: "Copiar arquivos para VPS (sem .env.local)"
        uses: appleboy/scp-action@v0.1.7
        with:
          host: "82.25.69.129"
          username: "root"
          password: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "."
          target: "/home/ubuntu/projetos/front-end-imobiliaria-escalla"
          strip_components: 1
          rm: true

      - name: "Build da aplicação (modo produção)"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: "82.25.69.129"
          username: "root"
          password: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/projetos/front-end-imobiliaria-escalla
            export NODE_ENV=production
            npm install
            npm install next react react-dom
            npm run build
            chown -R www-data:www-data .

      - name: "Rodar o servidor Next.js (modo produção)"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: "82.25.69.129"
          username: "root"
          password: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/projetos/front-end-imobiliaria-escalla
            pkill -f "node" || true
            nohup npm start &> /dev/null &